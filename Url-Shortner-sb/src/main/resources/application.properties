spring.application.name=Url-Shortner-sb

# MySQL Database Configuration
# server.port=9090
# spring.datasource.url=jdbc:mysql://localhost:3306/urlshortnerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=1234
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL Database Configuration - all values supplied via environment variables, see .env.example
server.port=9090
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema now; Hibernate only validates entities against it at startup.
# baseline-on-migrate lets Flyway adopt an already-existing, non-empty database (like the
# current Render instance, previouslyy managed by ddl-auto=update) without re-running V1's
# CREATE TABLE statements against tables that already exist. A genuinely fresh database has
# nothing to baseline, so V1 runs normally there and creates the schema from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=validate

# Show SQL Queries in the Console (Optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:172800000}

frontend.url=${FRONTEND_URL}

